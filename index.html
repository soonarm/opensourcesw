<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘 뭐 먹지?</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap');
:root{--ink:#392f4d;--muted:#827993}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:'Noto Sans KR',sans-serif;background:linear-gradient(135deg,#fff7f0,#f4f0ff 52%,#edfff9)}.wrap{width:min(1050px,calc(100% - 36px));margin:auto;padding:42px 0 58px}header{display:flex;justify-content:space-between;align-items:center}.brand{font:24px Jua}.brand-mark{display:inline-grid;place-items:center;width:44px;height:44px;margin-right:8px;border-radius:15px;background:#fff;box-shadow:0 7px 20px #c9b7c940}.date{font-size:13px;color:var(--muted);font-weight:700}.hero{text-align:center;margin:42px auto 34px}.eyebrow{display:inline-block;padding:8px 16px;border-radius:999px;background:#fff;color:#ab86d9;font-size:12px;font-weight:900}.hero h1{margin:16px 0 9px;font:52px Jua}.hero p{margin:0;color:var(--muted);font-size:15px}.app{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:28px;background:#ffffffb5;border:1px solid #fff;border-radius:32px;box-shadow:0 22px 60px #776b9620}.wheel-side{text-align:center}.wheel-box{position:relative;width:min(370px,80vw);aspect-ratio:1;margin:auto}.pointer{position:absolute;z-index:2;top:-13px;left:50%;transform:translateX(-50%);border-left:17px solid transparent;border-right:17px solid transparent;border-top:34px solid #ff7799;filter:drop-shadow(0 4px 2px #a74d6b55)}.wheel{width:100%;height:100%;border-radius:50%;border:12px solid #fff;background:conic-gradient(#ffb5c5 0 45deg,#ffd978 45deg 90deg,#aeead9 90deg 135deg,#bdb0ff 135deg 180deg,#ffc5a2 180deg 225deg,#a9ddff 225deg 270deg,#ffcae7 270deg 315deg,#c9edaf 315deg);box-shadow:inset 0 0 0 2px #ffffff88,0 14px 28px #66527635;transition:transform 3.8s cubic-bezier(.12,.75,.18,1)}.wheel:after{content:'🍴';position:absolute;inset:0;margin:auto;width:78px;height:78px;display:grid;place-items:center;background:#fff;border:7px solid #fff8;border-radius:50%;font-size:33px;box-shadow:0 3px 12px #765b6c35}.labels{position:absolute;inset:0}.label{position:absolute;top:50%;left:50%;width:78px;text-align:center;white-space:nowrap;font-size:12px;font-weight:900;color:#6b4e68;text-shadow:0 1px #fff8}.spin{margin-top:27px;border:0;border-radius:17px;padding:16px 35px;color:#fff;background:linear-gradient(135deg,#ff8fab,#ffb27d);font:20px Jua;cursor:pointer;box-shadow:0 9px 0 #db7891,0 14px 24px #d57e972e}.spin:active{transform:translateY(5px);box-shadow:0 4px 0 #db7891}.spin:disabled{opacity:.7;cursor:wait}.result{display:flex;flex-direction:column;justify-content:center;padding:10px 16px}.kicker{color:#bd91cb;font-size:13px;font-weight:900;letter-spacing:1px}.title{margin:8px 0;font:58px Jua}.copy{min-height:48px;color:var(--muted);line-height:1.7;font-size:14px}.tag{display:inline-block;margin-top:13px;padding:7px 12px;border-radius:10px;background:#fff0bc;color:#856e3b;font-size:12px;font-weight:900}.divider{height:1px;background:#e7deeb;margin:28px 0 22px}.filter-title{margin:0 0 14px;font-size:14px;font-weight:900}.filters{display:flex;flex-wrap:wrap;gap:9px}.filter{border:1px solid #eadfee;background:#fff;color:#74667e;padding:10px 15px;border-radius:12px;font:13px 'Noto Sans KR';cursor:pointer}.filter.active{background:#7d6ac7;border-color:#7d6ac7;color:#fff;box-shadow:0 6px 13px #8775c740}.tip{margin-top:24px;padding:13px 15px;border-radius:14px;background:#e9fbf5;color:#548477;font-size:12px}@media(max-width:760px){.app{grid-template-columns:1fr;padding:20px}.hero h1{font-size:42px}.result{text-align:center}.filters{justify-content:center}.date{display:none}}
</style></head>
<body><main class="wrap"><header><div class="brand"><span class="brand-mark">🍽️</span>오늘 뭐 먹지?</div><div class="date" id="date"></div></header><section class="hero"><span class="eyebrow">오늘의 메뉴 고민 해결소</span><h1>배고픈데, 뭘 먹지? 🤔</h1><p>룰렛을 돌리고 오늘의 맛있는 운명을 만나보세요!</p></section><section class="app"><div class="wheel-side"><div class="wheel-box"><div class="pointer"></div><div class="wheel" id="wheel"></div><div class="labels" id="labels"></div></div><button class="spin" id="spin">오늘 뭐 먹지? 🎲</button></div><div class="result"><div class="kicker">TODAY'S PICK</div><div class="title" id="title">메뉴를 뽑아볼까요?</div><p class="copy" id="copy">카테고리를 고르고 버튼을 눌러<br>맛있는 메뉴를 추천받아 보세요.</p><span class="tag" id="tag">두근두근 ✨</span><div class="divider"></div><p class="filter-title">어떤 음식이 당기나요?</p><div class="filters" id="filters"></div><div class="tip">💡 오늘은 새로운 메뉴에 도전해 보는 건 어때요?</div></div></section></main>
<script>
const menus=[['한식','비빔밥','알록달록 채소와 고소한 참기름의 완벽한 조화!'],['한식','김치찌개','보글보글 따끈한 국물로 든든하게 채워봐요.'],['한식','치킨','바삭하고 촉촉한 치킨은 언제나 옳아요!'],['한식','삼겹살','지글지글 구워지는 고소한 행복 한 점.'],['중식','마라탕','얼얼하고 매콤한 맛이 당기는 날에는 마라탕!'],['중식','짜장면','달콤 짭짤한 소스에 면을 쓱쓱 비벼 먹어요.'],['중식','탕수육','바삭한 튀김과 새콤달콤 소스의 만남.'],['일식','초밥','신선하고 깔끔한 한 점의 행복.'],['일식','돈카츠','바삭한 식감과 부드러운 고기의 조화!'],['일식','라멘','진한 국물 한 모금에 피로가 사르르.'],['양식','파스타','오늘은 분위기 있게 파스타 한 접시!'],['양식','피자','치즈가 쭉 늘어나는 행복을 즐겨요.'],['양식','스테이크','특별한 날처럼 근사한 한 끼를 즐겨보세요.']];
const colors=['#ffb5c5','#ffd978','#aeead9','#bdb0ff','#ffc5a2','#a9ddff','#ffcae7','#c9edaf'],cats=['전체','한식','중식','일식','양식'];let selected='전체',rotation=0,busy=false;const wheel=document.querySelector('#wheel'),labels=document.querySelector('#labels');document.querySelector('#date').textContent=new Intl.DateTimeFormat('ko-KR',{dateStyle:'long'}).format(new Date());
cats.forEach(c=>{const b=document.createElement('button');b.className='filter'+(c==='전체'?' active':'');b.textContent=c;b.onclick=()=>{selected=c;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.textContent===c));render()};document.querySelector('#filters').appendChild(b)});function list(){return selected==='전체'?menus:menus.filter(x=>x[0]===selected)}function render(){const a=list(),s=360/a.length;wheel.style.background=`conic-gradient(${a.map((_,i)=>`${colors[i%8]} ${i*s}deg ${(i+1)*s}deg`).join(',')})`;labels.innerHTML='';a.forEach((x,i)=>{const e=document.createElement('span');e.className='label';e.textContent=x[1];const ang=i*s+s/2;e.style.transform=`translate(-50%,-50%) rotate(${ang}deg) translateY(-137px) rotate(${-ang}deg)`;labels.appendChild(e)})}render();
document.querySelector('#spin').onclick=()=>{if(busy)return;busy=true;const a=list(),i=Math.floor(Math.random()*a.length),s=360/a.length,target=(360-(i*s+s/2))%360;rotation+=1440+target-(rotation%360);wheel.style.transform=`rotate(${rotation}deg)`;document.querySelector('#title').textContent='두근두근...';document.querySelector('#copy').textContent='오늘의 행운 메뉴를 고르는 중이에요!';document.querySelector('#tag').textContent='룰렛 돌아가는 중 🎡';document.querySelector('#spin').disabled=true;setTimeout(()=>{document.querySelector('#title').textContent=a[i][1];document.querySelector('#copy').textContent=a[i][2];document.querySelector('#tag').textContent=a[i][0]+' 메뉴 추천 ✨';document.querySelector('#spin').disabled=false;busy=false},3900)};
</script></body></html>
